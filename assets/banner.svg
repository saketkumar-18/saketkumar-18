<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="0.75" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <!-- Center-out typewriter clips (reveal from middle, one per role) -->
    <clipPath id="tw1"><rect x="600" y="196" width="0" height="46">
      <animate attributeName="width" values="0;360;360;360;0" keyTimes="0;0.05;0.20;0.24;0.25" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;420;420;420;600" keyTimes="0;0.05;0.20;0.24;0.25" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tw2"><rect x="600" y="196" width="0" height="46">
      <animate attributeName="width" values="0;0;360;360;360;0" keyTimes="0;0.25;0.30;0.45;0.49;0.50" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;600;420;420;420;600" keyTimes="0;0.25;0.30;0.45;0.49;0.50" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tw3"><rect x="600" y="196" width="0" height="46">
      <animate attributeName="width" values="0;0;360;360;360;0" keyTimes="0;0.50;0.55;0.70;0.74;0.75" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;600;420;420;420;600" keyTimes="0;0.50;0.55;0.70;0.74;0.75" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tw4"><rect x="600" y="196" width="0" height="46">
      <animate attributeName="width" values="0;0;360;360;360;0" keyTimes="0;0.75;0.80;0.95;0.99;1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;600;420;420;420;600" keyTimes="0;0.75;0.80;0.95;0.99;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <style>
    .name { font-size: 68px; font-weight: 800; letter-spacing: -1px; }
    .hi { font-size: 24px; font-weight: 600; fill: #94a3b8; letter-spacing: 8px; }
    .role { font-size: 30px; font-weight: 700; fill: #e2e8f0; font-family: 'Consolas','SF Mono','Courier New',monospace; }
    .tag { font-size: 17px; fill: #7dd3fc; letter-spacing: 1.5px; opacity: 0.85; }
    .sym { font-family: 'Consolas',monospace; fill: #ffffff; font-weight: 700; }
    .cursor { fill: #22d3ee; }
    .fadein { opacity: 0; animation: fade 1s ease forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    .p1 { animation: floaty 7s ease-in-out infinite; }
    .p2 { animation: floaty 9s ease-in-out infinite .5s; }
    .p3 { animation: floaty 11s ease-in-out infinite 1s; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,20px); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-25px); } }
    .b1 { animation: drift1 14s ease-in-out infinite; }
    .b2 { animation: drift2 18s ease-in-out infinite; }
    .b3 { animation: drift3 16s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="#0d1117"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- Aurora blobs -->
  <g class="b1"><circle cx="150" cy="70" r="230" fill="url(#blob1)"/></g>
  <g class="b2"><circle cx="1060" cy="270" r="250" fill="url(#blob2)"/></g>
  <g class="b3"><circle cx="1000" cy="40" r="180" fill="url(#blob3)"/></g>
  <g class="b2"><circle cx="180" cy="310" r="170" fill="url(#blob2)"/></g>

  <!-- Floating code symbols -->
  <text class="sym p1" x="90" y="130" font-size="26" opacity="0.09">&lt;/&gt;</text>
  <text class="sym p2" x="1080" y="150" font-size="24" opacity="0.09">{ }</text>
  <text class="sym p3" x="160" y="270" font-size="28" opacity="0.08">λ</text>
  <text class="sym p1" x="1010" y="90" font-size="24" opacity="0.08">∑</text>
  <text class="sym p2" x="60" y="210" font-size="20" opacity="0.07">def ai():</text>
  <text class="sym p3" x="1040" y="240" font-size="20" opacity="0.07">[ ]</text>

  <!-- Particles -->
  <g fill="#22d3ee">
    <circle class="p1" cx="260" cy="90" r="3" opacity="0.7"/>
    <circle class="p2" cx="420" cy="300" r="2.5" opacity="0.5"/>
    <circle class="p3" cx="940" cy="60" r="3" opacity="0.6"/>
    <circle class="p2" cx="820" cy="310" r="2" opacity="0.5"/>
  </g>
  <g fill="#f472b6">
    <circle class="p3" cx="330" cy="50" r="2.5" opacity="0.5"/>
    <circle class="p1" cx="880" cy="280" r="2.5" opacity="0.5"/>
    <circle class="p2" cx="1150" cy="180" r="2" opacity="0.4"/>
  </g>

  <!-- Centered text block -->
  <g class="fadein d1">
    <text x="600" y="95" text-anchor="middle" class="hi">HELLO WORLD, I AM</text>
  </g>
  <g class="fadein d2">
    <text x="600" y="172" text-anchor="middle" class="name" fill="url(#nameGrad)">Saket Kumar</text>
  </g>

  <!-- Typewriter roles (center-out reveal, cursor at line end) -->
  <g clip-path="url(#tw1)">
    <text x="600" y="230" text-anchor="middle" class="role">AI / ML Engineer</text>
    <rect x="738" y="206" width="3" height="30" class="cursor blink"/>
  </g>
  <g clip-path="url(#tw2)">
    <text x="600" y="230" text-anchor="middle" class="role">Data Scientist</text>
    <rect x="722" y="206" width="3" height="30" class="cursor blink"/>
  </g>
  <g clip-path="url(#tw3)">
    <text x="600" y="230" text-anchor="middle" class="role">LLM &amp; RAG Builder</text>
    <rect x="747" y="206" width="3" height="30" class="cursor blink"/>
  </g>
  <g clip-path="url(#tw4)">
    <text x="600" y="230" text-anchor="middle" class="role">GenAI Developer</text>
    <rect x="730" y="206" width="3" height="30" class="cursor blink"/>
  </g>

  <g class="fadein d3">
    <text x="600" y="272" text-anchor="middle" class="tag">B.Sc. Data Science &amp; AI  ·  IIT Guwahati  ·  Building AI for real-world impact</text>
  </g>

  <!-- Accent line growing from center -->
  <rect x="600" y="292" width="0" height="3" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;480" dur="1.4s" fill="freeze"/>
    <animate attributeName="x" values="600;360" dur="1.4s" fill="freeze"/>
  </rect>
</svg>
